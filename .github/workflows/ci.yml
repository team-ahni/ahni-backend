name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**', 'fix/**', 'docs/**', 'refactor/**', 'chore/**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle
      - name: Full harness verification
        run: ./scripts/verify
