spring.application.name=ahni-backend
spring.jpa.open-in-view=false
spring.flyway.enabled=false

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${AHNI_SUPABASE_URL}/auth/v1
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AHNI_SUPABASE_URL}/auth/v1/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256
spring.security.oauth2.resourceserver.jwt.audiences=authenticated
ahni.cors.allowed-origins=${AHNI_CORS_ALLOWED_ORIGINS:}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
ahni.storage.service-role-key=${AHNI_SUPABASE_SERVICE_ROLE_KEY:}
ahni.storage.inquiry-attachment-bucket=inquiry-attachments
