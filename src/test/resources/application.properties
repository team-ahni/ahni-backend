spring.datasource.url=jdbc:h2:mem:ahni_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
springdoc.api-docs.enabled=true

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

AHNI_SUPABASE_URL=https://supabase.test.invalid
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AHNI_SUPABASE_URL}/auth/v1
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AHNI_SUPABASE_URL}/auth/v1/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256
spring.security.oauth2.resourceserver.jwt.audiences=authenticated
ahni.storage.inquiry-attachment-bucket=inquiry-attachments
